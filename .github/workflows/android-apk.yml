name: Build Android Debug APK

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://ais-pre-gg45xuriuve3zvwph7g7t7-273340868786.asia-southeast1.run.app' }}

      - name: Sync Capacitor Android
        run: npm run cap:sync

      - name: Verify Firebase Android Configuration
        run: |
          echo "Checking google-services.json..."
          test -f android/app/google-services.json
          grep -n '"package_name"' android/app/google-services.json
          grep -n '"project_id"' android/app/google-services.json

          echo "Checking applicationId..."
          grep -n "applicationId" android/app/build.gradle

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Get Debug SHA Fingerprint
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-health-community-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
